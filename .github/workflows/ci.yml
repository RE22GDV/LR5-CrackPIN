name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Тести Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Встановити залежності
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Контрольні приклади
        run: python run.py selftest

      - name: Повний набір тестів
        run: python -m pytest -q

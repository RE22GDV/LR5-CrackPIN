[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr5-crackpin"
version = "1.0.0"
description = "Лабораторна робота №5: перебір цифрового PIN за MD5"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "matplotlib>=3.8,<4"]

[project.scripts]
crackpin = "crackpin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
